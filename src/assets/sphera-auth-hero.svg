<svg viewBox="0 0 800 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sphera Social" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101B45"/>
      <stop offset="1" stop-color="#2A1B6B"/>
    </linearGradient>
    <radialGradient id="globe" cx="35%" cy="30%" r="80%">
      <stop offset="0" stop-color="#8F8CFF"/>
      <stop offset="0.55" stop-color="#5B4FE8"/>
      <stop offset="1" stop-color="#2B1F9C"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#6C63FF" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6C63FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#BDB9FF"/>
    </linearGradient>
    <clipPath id="globeClip"><circle cx="400" cy="400" r="170"/></clipPath>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Transparent background: removed inner rect to eliminate all borders -->
  <circle cx="400" cy="400" r="330" fill="url(#glow)"/>

  <!-- back half of orbit -->
  <g transform="rotate(-20 400 400)" fill="none">
    <ellipse cx="400" cy="400" rx="290" ry="110" stroke="#9D98FF" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  </g>

  <!-- globe -->
  <circle cx="400" cy="400" r="170" fill="url(#globe)"/>
  <g clip-path="url(#globeClip)" fill="none" stroke="#FFFFFF" stroke-opacity="0.28" stroke-width="1.6">
    <ellipse cx="400" cy="400" rx="170" ry="60"/>
    <ellipse cx="400" cy="400" rx="170" ry="120"/>
    <ellipse cx="400" cy="400" rx="60" ry="170"/>
    <ellipse cx="400" cy="400" rx="120" ry="170"/>
    <line x1="400" y1="230" x2="400" y2="570"/>
    <line x1="230" y1="400" x2="570" y2="400"/>
  </g>
  <ellipse cx="345" cy="325" rx="70" ry="38" fill="#FFFFFF" fill-opacity="0.16" transform="rotate(-30 345 325)"/>

  <!-- connection lines -->
  <g stroke="#B9B5FF" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="2 6" stroke-linecap="round">
    <line x1="655" y1="366" x2="585" y2="258"/>
    <line x1="655" y1="366" x2="438" y2="503"/>
    <line x1="183" y1="538" x2="438" y2="503"/>
    <line x1="183" y1="538" x2="231" y2="360"/>
    <line x1="231" y1="360" x2="585" y2="258"/>
  </g>

  <!-- avatars -->
  <g filter="url(#soft)">
    <g transform="translate(655 366)">
      <circle r="34" fill="#22D3C5"/><circle cy="-8" r="11" fill="#0F2A3A"/><path d="M-19 22a19 15 0 0 1 38 0z" fill="#0F2A3A"/>
      <circle r="34" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <g transform="translate(183 538)">
      <circle r="38" fill="#FF7A90"/><circle cy="-9" r="12" fill="#4A1030"/><path d="M-21 25a21 17 0 0 1 42 0z" fill="#4A1030"/>
      <circle r="38" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <g transform="translate(231 360)">
      <circle r="28" fill="#FFC857"/><circle cy="-7" r="9" fill="#4A3300"/><path d="M-16 18a16 13 0 0 1 32 0z" fill="#4A3300"/>
      <circle r="28" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <g transform="translate(585 258)">
      <circle r="30" fill="#FF7A90"/><circle cy="-7" r="10" fill="#4A1030"/><path d="M-17 19a17 14 0 0 1 34 0z" fill="#4A1030"/>
      <circle r="30" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
    <g transform="translate(438 503)">
      <circle r="36" fill="#22D3C5"/><circle cy="-9" r="12" fill="#0F2A3A"/><path d="M-20 23a20 16 0 0 1 40 0z" fill="#0F2A3A"/>
      <circle r="36" fill="none" stroke="#fff" stroke-width="3"/>
    </g>
  </g>

  <!-- like pill -->
  <g filter="url(#soft)" transform="translate(560 540)">
    <rect width="150" height="54" rx="27" fill="#FFFFFF"/>
    <path d="M38 19c-3-5-11-4-11 3 0 6 11 13 11 13s11-7 11-13c0-7-8-8-11-3z" fill="#FF4D6D" transform="translate(-2 0)"/>
    <rect x="62" y="17" width="64" height="8" rx="4" fill="#C9C6F5"/>
    <rect x="62" y="31" width="42" height="8" rx="4" fill="#E4E2FA"/>
  </g>

  <!-- comment bubble -->
  <g filter="url(#soft)" transform="translate(70 215)">
    <path d="M26 0h128a26 26 0 0 1 26 26v22a26 26 0 0 1-26 26H62l-26 20v-20h-10A26 26 0 0 1 0 48V26A26 26 0 0 1 26 0z" fill="#FFFFFF"/>
    <circle cx="48" cy="37" r="7" fill="#5B4FE8"/>
    <circle cx="90" cy="37" r="7" fill="#22D3C5"/>
    <circle cx="132" cy="37" r="7" fill="#FF7A90"/>
  </g>

  <!-- front half of orbit -->
  <g transform="rotate(-20 400 400)" fill="none">
    <path d="M110 400a290 110 0 0 0 580 0" stroke="#C9C5FF" stroke-opacity="0.7" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- stars -->
  <g fill="#FFFFFF">
    <circle cx="120" cy="120" r="3" opacity="0.7"/><circle cx="690" cy="150" r="2.5" opacity="0.6"/>
    <circle cx="710" cy="640" r="3" opacity="0.5"/><circle cx="90" cy="680" r="2" opacity="0.6"/>
    <circle cx="520" cy="95" r="2" opacity="0.5"/><circle cx="300" cy="640" r="2.5" opacity="0.4"/>
  </g>

  <!-- wordmark -->
  <text x="400" y="755" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="68" font-weight="700" letter-spacing="-1.5" fill="url(#word)">Sphera <tspan font-weight="300" fill="#C9C5FF">Social</tspan></text>
  <text x="400" y="802" text-anchor="middle" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" fill="#B9B5FF">Your people. Your moments. One sphere.</text>
</svg>

<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Sphera Social" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6A5CF5"/>
      <stop offset="1" stop-color="#2E1FA6"/>
    </linearGradient>
    <radialGradient id="ball" cx="35%" cy="28%" r="80%">
      <stop offset="0" stop-color="#C9C5FF"/>
      <stop offset="0.5" stop-color="#8F88FF"/>
      <stop offset="1" stop-color="#5146E0"/>
    </radialGradient>
    <clipPath id="c"><circle cx="32" cy="32" r="14"/></clipPath>
  </defs>

  <rect width="64" height="64" rx="20.5" fill="url(#tile)"/>

  <!-- back orbit -->
  <g transform="rotate(-20 32 32)" fill="none">
    <path d="M6 32a26 9 0 0 1 52 0" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- sphere -->
  <circle cx="32" cy="32" r="14" fill="url(#ball)"/>
  <g clip-path="url(#c)" fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="1.2">
    <ellipse cx="32" cy="32" rx="14" ry="5"/>
    <ellipse cx="32" cy="32" rx="5" ry="14"/>
    <line x1="32" y1="18" x2="32" y2="46"/>
  </g>

  <!-- front orbit -->
  <g transform="rotate(-20 32 32)" fill="none">
    <path d="M6 32a26 9 0 0 0 52 0" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round"/>
  </g>

  <!-- people dots -->
  <circle cx="54.6" cy="28.5" r="4.6" fill="#22D3C5" stroke="#FFFFFF" stroke-width="1.8"/>
  <circle cx="12.4" cy="43.9" r="4.2" fill="#FF7A90" stroke="#FFFFFF" stroke-width="1.8"/>
</svg>
